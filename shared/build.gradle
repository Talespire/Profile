plugins {
    id 'java'
}

group = 'studio.talespire.profile'
version = '0.0.1'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly("studio.lunarlabs.universe:universe-shared:0.0.1")



    compileOnly "redis.clients:jedis:5.1.2"
    compileOnly "org.mongodb:mongodb-driver-reactivestreams:5.0.0"
}

test {
    useJUnitPlatform()
}